<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренажёр координат</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
  <div class="side-panel">
    <header><h1>♟ Тренажёр</h1></header>

    <div class="segmented" id="modeSelector" style="flex-direction: column;">
      <button data-mode="training" class="active">🎯 Тренировка</button>
      <button data-mode="auto">⏱ Авто</button>
    </div>

    <div class="segmented" id="taskSelector" style="flex-direction: column;">
      <button data-task="squares" class="active">⬜ Клетки</button>
      <button data-task="diagonals">⟋ Диагонали</button>
    </div>

    <div class="target-card" id="targetCard">
      <span class="chess-piece w" id="displayPiece">♔</span>
    </div>
    
    <div class="speed-row" id="speedRow" style="display:none;">
      <span class="speed-label">Скор.</span>
      <input type="range" class="speed-slider" id="speedSlider" min="200" max="5000" step="100" value="2000">
      <span class="speed-value" id="speedValue">2.0с</span>
    </div>

    <div class="controls">
      <button class="btn" id="resetBtn">↺ Сброс</button>
      <button class="btn" id="flipBtn">⇅ Перевернуть</button>
    </div>
    
    <div class="controls" style="justify-content: center;">
      <button class="btn stop-btn" id="stopBtn" style="display:none; flex: 1;">⏸ Стоп</button>
      <div class="sound-box">
        <button class="btn sound" id="soundBtn" title="Звук вкл/выкл">🔇</button>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="board-wrap">
      <div class="board" id="board"></div>
      <div class="board-overlay" id="boardOverlay"></div>
    </div>

    <div class="stats" id="stats">
      <div class="stat good"><div class="stat-value" id="scoreCorrect">0</div><div class="stat-label">Верно</div></div>
      <div class="stat bad"><div class="stat-value" id="scoreWrong">0</div><div class="stat-label">Ошибок</div></div>
      <div class="stat"><div class="stat-value" id="scoreStreak">0</div><div class="stat-label">Серия</div></div>
      <div class="stat"><div class="stat-value" id="scoreBest">0</div><div class="stat-label">Рекорд</div></div>
    </div>
  </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
