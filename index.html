<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренажёр координат</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
  <div class="side-panel">
    <header><h1>♟ Тренажёр</h1></header>

    <div class="segmented" id="modeSelector" style="flex-direction: column;">
      <button data-mode="training" class="active">🎯 Тренировка</button>
      <button data-mode="auto">⏱ Авто</button>
    </div>

    <div class="segmented" id="taskSelector" style="flex-direction: column;">
      <button data-task="squares" class="active">⬜ Клетки</button>
      <button data-task="diagonals">⟋ Диагонали</button>
    </div>

    <div class="segmented" id="pieceSelector" style="flex-direction: column;">
      <button data-piece="random" class="active">🎲 Рандом</button>
      <button data-piece="bishop">♗ Слон</button>
      <button data-piece="knight">♘ Конь</button>
      <button data-piece="rook">♖ Ладья</button>
      <button data-piece="queen">♕ Ферзь</button>
    </div>

    <div class="target-card">
      <div class="chess-piece random-placeholder" id="displayPiece">🎲</div>
    </div>
    
    <div class="toggle-container">
      <div class="toggle-item active" id="toggleCoord">
        <span>Координаты</span>
        <div class="toggle-switch"></div>
      </div>
      <div class="toggle-item active" id="toggleColor">
        <span>Цвет поля</span>
        <div class="toggle-switch"></div>
      </div>
      <div class="toggle-item active" id="diagToggleWrap">
        <span>Цвет диагонали</span>
        <div class="toggle-switch"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="resetBtn">↺ Сброс</button>
      <button class="btn stop-btn" id="stopBtn" style="display:none;">▶ Старт</button>
    </div>
  </div>

  <div class="main-content">
    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board">
        <div class="board-overlay" id="boardOverlay"></div>
        <div class="board-piece hidden" id="boardPiece"></div>
      </div>
    </div>

    <!-- Добавлен id="stats", из-за которого падал скрипт -->
    <div class="stats" id="stats">
      <div class="stat good"><div class="stat-value" id="scoreCorrect">0</div><div class="stat-label">Верно</div></div>
      <div class="stat bad"><div class="stat-value" id="scoreWrong">0</div><div class="stat-label">Ошибок</div></div>
      <div class="stat"><div class="stat-value" id="scoreStreak">0</div><div class="stat-label">Серия</div></div>
      <div class="stat"><div class="stat-value" id="scoreBest">0</div><div class="stat-label">Рекорд</div></div>
    </div>
  </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
